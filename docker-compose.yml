# Runs the Next.js app only — self-hosted Supabase keeps running separately
# via `npx supabase start` (its own Docker Compose project).
#
# Currently bound to 127.0.0.1 only (local-machine access). To later expose
# it to the whole network: change the port mapping below to "3000:3000" (or
# "<lan-ip>:3000:3000"), and rebuild with NEXT_PUBLIC_SUPABASE_URL set to
# your machine's LAN address instead of 127.0.0.1, since that value gets
# baked into the browser bundle at build time.
#
# Usage (reuses the existing .env.local as the single source of truth):
#   docker compose --env-file .env.local build
#   docker compose --env-file .env.local up -d

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: my-first-app:latest
    restart: unless-stopped
    ports:
      # Host port 3001 (3000 is taken by `npm run dev`); container listens on 3000 internally.
      - "127.0.0.1:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Overrides NEXT_PUBLIC_SUPABASE_URL for server-side code only — the
      # container's own 127.0.0.1 is itself, not the host running Supabase.
      SUPABASE_URL: http://host.docker.internal:54321
